  <text class="mono grey" x="30" y="102" font-size="11.5">22 modules · 24 controllers · 195 endpoints</text>
  <text class="mono grey" x="30" y="120" font-size="11.5">31 Prisma models · 18 enums · 17 test suites</text>

  <rect x="30" y="136" width="186" height="3" rx="1.5" fill="#1f2933" />
  <rect x="30" y="136" width="186" height="3" rx="1.5" fill="#f5a623" />

  <text class="mono dim" x="30" y="164" font-size="10" letter-spacing="2">WISA CONNECT / WISA-CONNECT</text>
  <text class="mono green" x="30" y="188" font-size="15">Rust · Tauri v2 · TypeScript</text>
  <text class="mono grey" x="30" y="208" font-size="11.5">Desktop client for Claude Code · Codex CLI · Claude Desktop</text>

  <rect x="470" y="48" width="1" height="160" fill="#1f2933" />

  <text class="mono dim" x="500" y="58" font-size="10" letter-spacing="2">STACK</text>
  <text class="mono grey" x="500" y="80" font-size="12">TypeScript · NestJS · Next.js · Prisma</text>
  <text class="mono grey" x="500" y="98" font-size="12">MySQL · Redis · Bull · Tailwind · Radix</text>
  <text class="mono grey" x="500" y="116" font-size="12">Rust · Tauri · Python · Docker · pnpm</text>
  <text class="mono grey" x="500" y="134" font-size="12">GitHub Actions · OpenTelemetry · Sentry</text>

  <text class="mono dim" x="500" y="164" font-size="10" letter-spacing="2">FOCUS</text>
  <text class="mono amber" x="500" y="186" font-size="12">SEO · GEO · AEO · AI content agents</text>
  <text class="mono grey" x="500" y="206" font-size="12">Multi-tenant social engine · LLM gateway</text>

  <rect x="0.5" y="0.5" width="899" height="239" rx="10" fill="none" stroke="#1f2933" />
