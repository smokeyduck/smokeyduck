<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240" role="img" aria-label="System info: SocialHive and WISA Connect">
  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .amber { fill: #f5a623; }
    .green { fill: #3ddc84; }
    .grey  { fill: #8b949e; }
    .dim   { fill: #5a6572; }
  </style>

  <rect x="0" y="0" width="900" height="240" rx="10" fill="#0b0f14" />
  <rect x="0" y="0" width="900" height="32" fill="#121a22" />
  <rect x="0" y="31" width="900" height="1" fill="#1f2933" />

  <circle cx="20" cy="16" r="4.5" fill="#ff5f56" />
  <circle cx="36" cy="16" r="4.5" fill="#ffbd2e" />
  <circle cx="52" cy="16" r="4.5" fill="#27c93f" />
  <text class="mono grey" x="72" y="20" font-size="11.5">sysinfo — winsell</text>

  <text class="mono dim" x="30" y="58" font-size="10" letter-spacing="2">SOCIALHIVE / SOCIAL-HIVE</text>
