name: Render profile telemetry

# Regenerates assets/metrics.svg from live GitHub data and commits the result.
# The card is committed (not hot-linked) so the profile stays readable even if
# a third-party card service is down, and so the numbers are auditable.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/render-metrics.mjs
      - .github/workflows/metrics.yml

permissions:
  contents: write

concurrency:
  group: profile-metrics
  cancel-in-progress: true

jobs:
  render:
    name: Render metrics.svg
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Render contribution telemetry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USER: ${{ github.repository_owner }}
          OUT_FILE: assets/metrics.svg
        run: node scripts/render-metrics.mjs

      - name: Commit updated card
        run: |
          git add assets/metrics.svg
          if git diff --cached --quiet -- assets/metrics.svg; then
            echo "No change in assets/metrics.svg"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh profile telemetry"
          git push
